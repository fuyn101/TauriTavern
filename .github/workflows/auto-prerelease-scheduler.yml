name: Auto Pre-Release Scheduler

on:
  schedule:
    # GitHub schedules use UTC: 10:00 UTC is 18:00 in China.
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: auto-prerelease-scheduler
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    name: dispatch-canary-dev

    steps:
      - name: Dispatch Canary build when dev advances
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: branchData } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "dev",
            });
            const headSha = branchData.commit.sha;
            let canaryCommit;
            try {
              ({ data: canaryCommit } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: "Canary",
              }));
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              core.notice(`No Canary release exists yet; dispatching the first build for dev ${headSha}.`);
            }

            if (canaryCommit?.sha === headSha) {
              core.info(`Skipping Canary: dev ${headSha} is already published.`);
              return;
            }

            if (canaryCommit) {
              core.notice(`Canary ${canaryCommit.sha} -> dev ${headSha}; dispatching.`);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "canary-release.yml",
              ref: "dev",
            });
